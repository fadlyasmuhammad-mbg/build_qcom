name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: mhmmdfdlyas/dockerfile:k-ubuntu

    env:
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/bengal-upstream/kernel_xiaomi_sm8250.git -b qcom_sm8250 kernel

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.repository }}
          restore-keys: |
            ccache-

      - name: Restore Clang Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-r584948b

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir clang
          cd clang

          wget -q \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r584948b.tar.gz \
            -O clang.tar.gz

          tar -xzf clang.tar.gz
          rm -f clang.tar.gz

      - name: Show Clang Version
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          clang --version

      - name: Configure Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"

          cd kernel
          make O=out vendor/bengal-perf_defconfig

      - name: Build Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"

          cd kernel

          make -j$(nproc) \
            O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          compression-level: 0
          if-no-files-found: warn
          path: |
            kernel/out/arch/arm64/boot/**
