name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mhmmdfdlyas/dockerfile:k-ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          compression-level: 0
          if-no-files-found: warn
          path: kernel/out/arch/arm64/boot/Image

      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: DTB-File
          compression-level: 0
          if-no-files-found: warn
          path: kernel/out/arch/arm64/boot/dtb

      - name: Upload DTBO
        uses: actions/upload-artifact@v4
        with:
          name: DTBO-File
          compression-level: 0
          if-no-files-found: warn
          path: kernel/out/arch/arm64/boot/dtbo.img

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          compression-level: 0
          if-no-files-found: warn
          path: kernel/build.log
