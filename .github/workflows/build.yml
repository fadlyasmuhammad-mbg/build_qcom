name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: mhmmdfdlyas/dockerfile:k-ubuntu

    env:
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 \
            -b qcom_sm8250 \
            https://github.com/bengal-upstream/kernel_xiaomi_sm8250.git \
            kernel

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: Clone AOSP Clang
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
            clang

      - name: Detect Latest Clang
        run: |
          CLANG_DIR=$(find clang -maxdepth 1 -type d -name "clang-r*" | sort -V | tail -n1)
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV

      - name: Show Clang Version
        run: |
          export PATH="$PWD/$CLANG_DIR/bin:$PATH"
          clang --version

      - name: Configure Kernel
        run: |
          export PATH="$PWD/$CLANG_DIR/bin:$PATH"

          cd kernel

          make O=out vendor/bengal-perf_defconfig

      - name: Build Kernel
        run: |
          export PATH="$PWD/$CLANG_DIR/bin:$PATH"

          cd kernel

          make -j$(nproc --all) \
            O=out \
            LLVM=1 \
            LLVM_IAS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
