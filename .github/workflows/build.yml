name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: mhmmdfdlyas/dockerfile:k-ubuntu

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          compression-level: 0
          if-no-files-found: warn
          path: kernel/out/arch/arm64/boot/**
